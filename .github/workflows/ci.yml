name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p /tmp/rag-test-data
          python -m pytest tests/ -v --tb=short --basetemp=/tmp/pytest-tmp
        env:
          DASHSCOPE_API_KEY: fake-ci-key
          RAG_DATA_DIR: /tmp/rag-test-data
          TMPDIR: /tmp
          SQLITE_TMPDIR: /tmp
